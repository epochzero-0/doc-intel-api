name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # Includes the forged-token and cross-tenant isolation tests.
      - name: Test
        run: pytest -q

  deploy:
    needs: test
    # Skipped until infra/setup.sh has set the repo variables.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    # arm64 runner: the image runs on a Graviton (t4g) instance.
    runs-on: ubuntu-24.04-arm
    concurrency: deploy
    permissions:
      id-token: write # GitHub OIDC token, exchanged for short-lived AWS credentials
      contents: read
    env:
      AWS_REGION: ap-southeast-1
      IMAGE: ${{ vars.ECR_REGISTRY }}/docintel-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Build and push to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${{ vars.ECR_REGISTRY }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Roll the instance onto this commit
        run: |
          cmd=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"/opt/docintel/deploy.sh $IMAGE\"]" \
            --query Command.CommandId --output text)
          inv() { aws ssm get-command-invocation --command-id "$cmd" --instance-id "${{ vars.EC2_INSTANCE_ID }}" "$@"; }
          for _ in $(seq 1 120); do # up to 10 minutes; the pull dominates
            sleep 5
            status=$(inv --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          inv --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "status: $status"
          test "$status" = Success

      - name: Health check through CloudFront
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.API_URL }}/")
            echo "attempt $i: $code"
            [ "$code" = 200 ] && exit 0
            sleep 6
          done
          exit 1
